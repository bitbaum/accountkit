<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>accountkit demo</title>
    <link
      rel="stylesheet"
      href="../node_modules/@bitbaum/design-tokens/tokens.css"
    />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* Page chrome only — the menu's look comes from styles.css + tokens. */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: hsl(var(--surface-page, 0 0% 98%));
        color: hsl(var(--text-primary, 0 0% 10%));
      }
      header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid hsl(var(--border-subtle, 0 0% 90%));
      }
      /* A 44px control beside the account trigger, as a header's menu
         button sits. */
      .demo-control {
        inline-size: 44px;
        block-size: 44px;
        flex-shrink: 0;
        border: 1px solid hsl(var(--border-subtle, 0 0% 90%));
        border-radius: 8px;
        background: transparent;
        color: inherit;
      }
      h2 {
        margin: 0 auto 0 0;
        font-size: 14px;
        font-weight: 500;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Named</h2>
      <div id="named"></div>
    </header>
    <header>
      <h2>No name, no photo</h2>
      <div id="anonymous"></div>
    </header>
    <header>
      <h2>Broken photo, failing sign-out</h2>
      <div id="failing"></div>
    </header>
    <header>
      <h2>Other accounts to switch to</h2>
      <div id="switching"></div>
    </header>
    <header>
      <h2>Followed by a control, end</h2>
      <div id="row-followed-end"></div>
      <button type="button" class="demo-control" aria-label="Menu">≡</button>
    </header>
    <header>
      <h2>Followed by a control, start</h2>
      <div id="row-followed-start"></div>
      <button type="button" class="demo-control" aria-label="Menu">≡</button>
    </header>
    <header>
      <h2>Preceded by a control, end</h2>
      <button type="button" class="demo-control" aria-label="Search">⌕</button>
      <div id="row-preceded-end"></div>
    </header>
    <header>
      <h2>Preceded by a control, start</h2>
      <button type="button" class="demo-control" aria-label="Search">⌕</button>
      <div id="row-preceded-start"></div>
    </header>
    <header>
      <h2>Loading, signed out, signed in</h2>
      <div id="control-loading"></div>
      <div id="control-signed-out"></div>
      <div id="control-signed-in"></div>
    </header>
    <div id="signin-error"></div>
    <main
      id="auth-recovery"
      style="max-width: 390px; padding: 16px; margin: auto"
    ></main>
    <main
      id="auth-recovery-adapter"
      style="max-width: 390px; padding: 16px; margin: auto"
    ></main>
    <div id="auth-signup" style="max-width: 28rem; margin: 2rem auto"></div>
    <div id="auth-words" style="max-width: 28rem; margin: 2rem auto"></div>
    <div id="auth-code" style="max-width: 28rem; margin: 2rem auto"></div>
    <div id="auth-lightning" style="max-width: 28rem; margin: 2rem auto"></div>
    <div id="auth-door" style="max-width: 28rem; margin: 2rem auto"></div>
    <div id="auth-claim" style="max-width: 28rem; margin: 2rem auto"></div>
    <script src="./dist/demo.js"></script>
  </body>
</html>
